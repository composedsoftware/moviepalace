name: iOS Screenshot

on:
  push:
    paths:
      - ".github/workflows/ios-screenshot.yml"
  workflow_dispatch:
    inputs:
      device:
        description: Simulator device type name
        default: iPhone Duo
      launch_wait:
        description: Seconds to wait after launch before the screenshot
        default: "10"

jobs:
  screenshot:
    runs-on: xcode-27
    permissions:
      contents: write
    defaults:
      run:
        working-directory: client/ios
    env:
      DEVICE_NAME: ${{ inputs.device || 'iPhone Duo' }}
      LAUNCH_WAIT: ${{ inputs.launch_wait || '10' }}
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project moviepalace.xcodeproj \
            -scheme moviepalace \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Find or create simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r --arg n "$DEVICE_NAME" '[.devices[][] | select(.name == $n)][0].udid // empty')
          if [ -z "$udid" ]; then
            type_id=$(xcrun simctl list devicetypes -j \
              | jq -r --arg n "$DEVICE_NAME" '.devicetypes[] | select(.name == $n) | .identifier')
            if [ -z "$type_id" ]; then
              echo "::error::No simulator device type named '$DEVICE_NAME'. Available:"
              xcrun simctl list devicetypes
              exit 1
            fi
            runtime=$(xcrun simctl list runtimes available -j \
              | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier')
            udid=$(xcrun simctl create "$DEVICE_NAME" "$type_id" "$runtime")
          fi
          echo "UDID=$udid" >> "$GITHUB_ENV"

      - name: Boot simulator
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3

      - name: Install and launch app
        run: |
          app=build/Build/Products/Debug-iphonesimulator/moviepalace.app
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist")
          xcrun simctl install "$UDID" "$app"
          xcrun simctl launch "$UDID" "$bundle_id"
          sleep "$LAUNCH_WAIT"

      - name: Take screenshot
        run: |
          mkdir -p screenshots
          name=$(echo "$DEVICE_NAME" | tr ' ' '-')
          # Devices with more than one screen refuse a screenshot without
          # --display, and list the display ids in the error.
          if ! out=$(xcrun simctl io "$UDID" screenshot "screenshots/$name.png" 2>&1); then
            echo "$out"
            ids=$(echo "$out" | grep -oE -- '--display=[0-9]+' | cut -d= -f2)
            [ -n "$ids" ] || exit 1
            for id in $ids; do
              xcrun simctl io "$UDID" screenshot --display="$id" "screenshots/$name-display-$id.png"
            done
          fi

      - name: Push screenshots to temporary branch
        working-directory: client/ios/screenshots
        run: |
          git init -q -b out
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm screenshots
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out:tmp/screenshot-output

      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshot
          path: client/ios/screenshots/*.png

      - name: Shut down simulator
        if: always()
        run: xcrun simctl shutdown "$UDID" || true
