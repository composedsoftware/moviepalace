name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "client/ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "client/ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: client/ios
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Show Xcode version
        run: xcodebuild -version

      # Secrets aren't passed to pull requests from forks, so the build still runs with an empty key there.
      - name: Write Secrets.swift
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::warning::TMDB_API_KEY secret is not set; building without a TMDB key"
          fi
          cat > moviepalace/Secrets.swift <<EOF
          enum Secrets {
              static let tmdbAPIKey = "$TMDB_API_KEY"
          }
          EOF

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project moviepalace.xcodeproj \
            -scheme moviepalace \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
