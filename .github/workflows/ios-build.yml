name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "client/ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "client/ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: client/ios
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project moviepalace.xcodeproj \
            -scheme moviepalace \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
