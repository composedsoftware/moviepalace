<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap">
  <style>
    /* ─── Tokens (shared with blurred-poster) ─── */
    :root {
      --bg:               #0C0C0E;
      --surface:          #161618;
      --border:           #2C2C30;
      --text:             #EAE6DE;
      --muted:            #7A7680;
      --accent:           #C43A57;
      --accent-dim:       #8C2A3E;
      --success:          #3D8C6E;
      --success-bg:       rgba(61, 140, 110, 0.12);
      --wrong-bg:         rgba(196, 58, 87, 0.10);
      --kw-active-bg:     rgba(196, 58, 87, 0.14);
      --kw-active-border: rgba(196, 58, 87, 0.5);
      --side-w:           min(260px, 100%);
      --thumb-w:          42px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Mono", "Courier New", monospace;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3.5rem 1.5rem 3.5rem;
    }

    .wordmark {
      position: fixed;
      top: 1.25rem;
      left: 1.5rem;
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      user-select: none;
    }

    /* ─── Two-column layout ─── */
    .layout {
      display: flex;
      flex-direction: row;
      gap: 2.25rem;
      align-items: flex-start;
      width: 100%;
      max-width: 880px;
    }

    .left-col {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      width: var(--side-w);
      flex-shrink: 0;
      position: sticky;
      top: 3.5rem;
    }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 2.25rem;
      flex: 1;
      min-width: 0;
    }

    @media (max-width: 680px) {
      .layout    { flex-direction: column; align-items: stretch; }
      .left-col  { width: 100%; position: static; }
    }

    section { display: flex; flex-direction: column; gap: 0.75rem; }
    section[hidden] { display: none; }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .section-label {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status {
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      min-height: 0.9rem;
    }

    .status.wrong { color: var(--accent); }
    .status.success { color: var(--success); }

    /* ─── Controls ─── */
    .controls { display: flex; gap: 0.625rem; }

    .btn {
      flex: 1;
      padding: 0.7rem 0.75rem;
      font-family: "DM Mono", monospace;
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .btn:hover, .btn:focus-visible { color: var(--text); border-color: var(--text); outline: none; }
    .btn:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--text); }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn[hidden] { display: none; }

    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--text); }
    .btn-primary:hover, .btn-primary:focus-visible {
      background: var(--accent-dim); border-color: var(--accent-dim); color: var(--text);
    }

    /* ─── Length selector (segmented control) ─── */
    .seg {
      display: flex;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .seg-btn {
      flex: 1;
      padding: 0.42rem 0;
      font-family: "DM Mono", monospace;
      font-size: 0.56rem;
      font-weight: 500;
      background: transparent;
      border: none;
      border-right: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-variant-numeric: tabular-nums;
      transition: color 0.15s, background 0.15s;
    }

    .seg-btn:last-child { border-right: none; }
    .seg-btn:hover:not([aria-pressed="true"]) { color: var(--text); background: rgba(255,255,255,0.04); }
    .seg-btn[aria-pressed="true"] { background: var(--border); color: var(--text); cursor: default; }
    .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* ─── Puzzle chain ─── */
    .chain { list-style: none; display: flex; flex-direction: column; }

    .chain-film {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      width: 100%;
      padding: 0.5rem 0.6rem 0.5rem 0;
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font: inherit;
      transition: background 0.15s;
    }

    .chain-film:hover, .chain-film:focus-visible { background: var(--surface); outline: none; }
    .chain-film:focus-visible { box-shadow: inset 2px 0 0 var(--accent); }

    .chain-num {
      width: 1.4rem;
      flex-shrink: 0;
      text-align: right;
      font-size: 0.55rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .thumb {
      width: var(--thumb-w);
      height: calc(var(--thumb-w) * 1.5);
      flex-shrink: 0;
      object-fit: cover;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .chain-text { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }

    .chain-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.15;
    }

    .chain-year {
      font-size: 0.55rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* The link between two films: a guess box on the joint, checked against both casts */
    .link {
      display: flex;
      gap: 0.9rem;
      padding-left: calc(1.4rem + 0.9rem + var(--thumb-w) / 2 - 0.5px);
      min-height: 2.6rem;
    }

    .link::before { content: ""; width: 1px; flex-shrink: 0; background: var(--border); }
    .link[data-state="right"]::before { background: var(--success); }

    .link-body {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      flex: 1;
      min-width: 0;
      padding: 0.3rem 0;
    }

    .link-guess { position: relative; width: min(220px, 100%); }
    .link-guess[hidden] { display: none; }

    .link-input {
      width: 100%;
      font-family: "DM Mono", monospace;
      font-size: 0.64rem;
      padding: 0.45rem 0.6rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .link-input::placeholder { color: var(--muted); }
    .link-input:focus { border-color: var(--muted); }
    .link-input:disabled { opacity: 0.4; }

    .link-result { font-size: 0.6rem; letter-spacing: 0.06em; }
    .link-result.right { color: var(--success); }
    .link-result.wrong { color: var(--accent); }

    .link-answer { display: none; font-size: 0.6rem; letter-spacing: 0.06em; color: var(--muted); }
    .chain.reveal .link:not([data-state="right"]) .link-answer { display: inline; }
    .chain.reveal .link:not([data-state="right"]) .link-guess { display: none; }

    .empty {
      padding: 2.5rem 0;
      text-align: center;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--border);
      border: 1px dashed var(--border);
    }

    /* ─── Trail (explorer path) ─── */
    .trail-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.64rem;
      counter-reset: movie;
    }

    .trail-list [data-kind="movie"] { counter-increment: movie; color: var(--text); }
    .trail-list [data-kind="movie"]::before { content: counter(movie) ". "; color: var(--muted); }
    .trail-list [data-kind="actor"] { color: var(--accent); padding-left: 1.1rem; }
    .trail-list [data-kind="actor"]::before { content: "↳ "; }
    .trail-list.hide-actors [data-kind="actor"] { display: none; }

    .link-btn {
      font: inherit;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.55rem;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .link-btn:hover, .link-btn:focus-visible { color: var(--text); outline: none; }

    /* ─── Search + dropdown ─── */
    .search-row { position: relative; }

    .search-input {
      width: 100%;
      font-family: "DM Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.03em;
      padding: 0.7rem 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--muted); }

    .suggest-drop {
      position: absolute;
      top: calc(100% - 1px);
      left: 0;
      right: 0;
      z-index: 20;
      background: var(--surface);
      border: 1px solid var(--muted);
      border-top: none;
      overflow-y: auto;
      max-height: 260px;
    }

    .suggest-drop[hidden] { display: none; }

    .suggest-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
      padding: 0.6rem 0.85rem;
      font-family: "DM Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.02em;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      transition: background 0.1s, color 0.1s;
    }

    .suggest-item:last-child { border-bottom: none; }
    .suggest-item:hover,
    .suggest-item[aria-selected="true"] { background: var(--border); color: var(--text); }

    .suggest-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .suggest-year  { flex-shrink: 0; font-size: 0.6rem; color: var(--muted); }

    /* ─── Explorer tables ─── */
    .trail { display: flex; flex-direction: column; gap: 1.5rem; }

    table { width: 100%; border-collapse: collapse; font-size: 0.66rem; }

    caption {
      text-align: left;
      padding-bottom: 0.55rem;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.1rem;
      font-weight: 600;
    }

    caption .cap-prefix {
      font-family: "DM Mono", monospace;
      font-size: 0.55rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-right: 0.5rem;
    }

    th {
      font-size: 0.52rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 0 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    th, td { text-align: left; }
    th:not(:first-child), td:not(:first-child) { text-align: right; padding-left: 1rem; }
    td { padding: 0.4rem 0; border-bottom: 1px solid var(--border); color: var(--muted); font-variant-numeric: tabular-nums; }

    td a { color: var(--text); text-decoration: none; }
    td a:hover, td a:focus-visible { color: var(--accent); outline: none; text-decoration: underline; text-underline-offset: 3px; }
    td.none { text-align: left !important; font-style: italic; }

  </style>
</head>
<body>

  <span class="wordmark">MoviePalace</span>

  <div class="layout">

    <!-- ── Left column: generator controls + explorer trail ── -->
    <div class="left-col">
      <section aria-label="Puzzle settings">
        <span class="section-label">Films in chain</span>
        <div class="seg" id="lenSeg" role="group" aria-label="Films in chain"></div>
        <div class="controls">
          <button class="btn btn-primary" id="btnGenerate" type="button">Generate</button>
          <button class="btn" id="btnReveal" type="button" hidden>Show answers</button>
        </div>
        <div class="status" id="genStatus" aria-live="polite"></div>
      </section>

      <section id="trailSection" aria-label="Explorer path" hidden>
        <div class="section-header">
          <span class="section-label">Path</span>
          <button class="link-btn" id="btnActors" type="button">Hide actors</button>
        </div>
        <ol class="trail-list" id="trailList"></ol>
      </section>
    </div>

    <!-- ── Right column: puzzle + explorer ── -->
    <div class="right-col">
      <section aria-label="Puzzle">
        <span class="section-label">Connections</span>
        <ol class="chain" id="chain"></ol>
        <p class="empty" id="chainEmpty">Generate a puzzle</p>
      </section>

      <section aria-label="Explore cast and films">
        <span class="section-label">Explore</span>
        <div class="search-row">
          <input
            class="search-input"
            id="searchInput"
            type="text"
            placeholder="Find a film…"
            autocomplete="off"
            spellcheck="false"
            aria-autocomplete="list"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="suggestDrop"
          >
          <div class="suggest-drop" id="suggestDrop" role="listbox" aria-label="Matching films" hidden></div>
        </div>
        <div class="trail" id="trail"></div>
      </section>
    </div>
  </div>

  <script>
    const lenSeg       = document.getElementById("lenSeg");
    const btnGenerate  = document.getElementById("btnGenerate");
    const btnReveal    = document.getElementById("btnReveal");
    const genStatus    = document.getElementById("genStatus");
    const chainEl      = document.getElementById("chain");
    const chainEmpty   = document.getElementById("chainEmpty");
    const trailSection = document.getElementById("trailSection");
    const trailList    = document.getElementById("trailList");
    const btnActors    = document.getElementById("btnActors");
    const searchInput  = document.getElementById("searchInput");
    const suggestDrop  = document.getElementById("suggestDrop");
    const trail        = document.getElementById("trail");

    const LENGTHS     = [3, 4, 5, 6, 7, 8, 9, 10];
    const LEN_STORE   = "moviepalace.puzzleGenerator.length";
    const RECENT_PUZZLES = 3; // films from the last few puzzles are skipped
    const recentPuzzles  = [];

    let length = 7;
    try { length = LENGTHS.includes(Number(localStorage.getItem(LEN_STORE))) ? Number(localStorage.getItem(LEN_STORE)) : 7; } catch { /* storage unavailable */ }

    let exploreSeq = 0; // guards against out-of-order responses when clicks overlap

    // Current puzzle: steps from the server, and the score for the link guesses
    let steps   = [];
    let solved  = 0;
    let misses  = 0;

    async function getJson(url) {
      const res = await fetch(url);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error ?? `HTTP ${res.status}`);
      return body;
    }

    // ─── Length selector ──────────────────────────────────────────────────
    function renderLengths() {
      lenSeg.innerHTML = "";
      for (const n of LENGTHS) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "seg-btn";
        b.textContent = String(n);
        b.setAttribute("aria-pressed", String(n === length));
        b.addEventListener("click", () => {
          length = n;
          try { localStorage.setItem(LEN_STORE, String(n)); } catch { /* storage unavailable */ }
          renderLengths();
        });
        lenSeg.appendChild(b);
      }
    }

    // ─── Generator ────────────────────────────────────────────────────────
    function setStatus(msg, kind = "") {
      genStatus.textContent = msg;
      genStatus.className = `status ${kind}`;
    }

    function setRevealed(on) {
      chainEl.classList.toggle("reveal", on);
      btnReveal.textContent = on ? "Hide answers" : "Show answers";
      for (const input of chainEl.querySelectorAll(".link-input")) input.disabled = on;
    }

    function updateScore() {
      const total = steps.length - 1;
      if (total < 1) return;
      const missText = `${misses} ${misses === 1 ? "miss" : "misses"}`;
      if (solved === total) setStatus(`Solved! ${missText}`, "success");
      else setStatus(`${solved} of ${total} links · ${missText}`);
    }

    // Any actor billed in both films counts, not just the one the generator used.
    function buildLink(prev, cur) {
      const link = document.createElement("div");
      link.className = "link";
      link.dataset.state = "open";

      const body = document.createElement("div");
      body.className = "link-body";

      const guess = document.createElement("div");
      guess.className = "link-guess";
      const input = Object.assign(document.createElement("input"), {
        className: "link-input", type: "text", placeholder: "Shared actor…",
        autocomplete: "off", spellcheck: false,
      });
      input.setAttribute("aria-label", `Actor in both ${prev.title} and ${cur.title}`);
      const drop = document.createElement("div");
      drop.className = "suggest-drop";
      drop.setAttribute("role", "listbox");
      drop.hidden = true;
      guess.append(input, drop);

      const result = document.createElement("span");
      result.className = "link-result";
      result.setAttribute("aria-live", "polite");

      const answer = document.createElement("span");
      answer.className = "link-answer";
      answer.textContent = cur.via.name;

      body.append(guess, result, answer);
      link.appendChild(body);

      autocomplete(input, drop, {
        fetchItems: async q => (await getJson(`/v1/movies/actors/suggest?q=${encodeURIComponent(q)}`)).results,
        label: a => a.name,
        onPick: actor => {
          input.value = "";
          if (prev.castIds.includes(actor.id) && cur.castIds.includes(actor.id)) {
            link.dataset.state = "right";
            guess.hidden = true;
            result.className = "link-result right";
            result.textContent = actor.name;
            solved++;
            // Move on to the next open link
            chainEl.querySelector('.link[data-state="open"] .link-input')?.focus();
          } else {
            misses++;
            result.className = "link-result wrong";
            result.textContent = `${actor.name} isn't in both`;
          }
          updateScore();
        },
      });

      return link;
    }

    function renderChain(next) {
      steps  = next;
      solved = 0;
      misses = 0;
      chainEl.innerHTML = "";
      chainEmpty.hidden = steps.length > 0;
      btnReveal.hidden  = steps.length === 0;

      steps.forEach((s, i) => {
        const li = document.createElement("li");

        if (i > 0 && s.via) li.appendChild(buildLink(steps[i - 1], s));

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chain-film";
        btn.title = "Explore the cast";
        btn.addEventListener("click", () => showCast(s.id));

        const num = document.createElement("span");
        num.className = "chain-num";
        num.textContent = String(i + 1);

        const img = document.createElement("img");
        img.className = "thumb";
        img.alt = "";
        img.loading = "lazy";
        if (s.posterUrl) img.src = s.posterUrl;

        const text = document.createElement("span");
        text.className = "chain-text";
        const title = document.createElement("span");
        title.className = "chain-title";
        title.textContent = s.title;
        const year = document.createElement("span");
        year.className = "chain-year";
        year.textContent = s.year ?? "";
        text.append(title, year);

        btn.append(num, img, text);
        li.appendChild(btn);
        chainEl.appendChild(li);
      });

      setRevealed(false);
    }

    async function generate() {
      btnGenerate.disabled = true;
      setStatus("Searching…");
      try {
        const avoid = recentPuzzles.flat().join(",");
        const data = await getJson(`/v1/movies/connections?length=${length}${avoid ? `&avoid=${avoid}` : ""}`);
        clearTrail();
        renderChain(data.steps);
        if (data.steps.length < data.requested) {
          setStatus(`Only reached ${data.steps.length} of ${data.requested} films`);
        } else {
          updateScore();
        }

        recentPuzzles.push(data.steps.map(s => s.id));
        while (recentPuzzles.length > RECENT_PUZZLES) recentPuzzles.shift();
      } catch (err) {
        setStatus(err.message === "Failed to fetch" ? "Could not reach the server" : err.message, "wrong");
      } finally {
        btnGenerate.disabled = false;
      }
    }

    btnGenerate.addEventListener("click", generate);
    btnReveal.addEventListener("click", () => setRevealed(!chainEl.classList.contains("reveal")));

    // ─── Explorer trail ───────────────────────────────────────────────────
    // Clicking discards everything downstream of the clicked link, so the trail
    // always reads as one path rather than a pile of abandoned branches.
    function clearTrail() {
      exploreSeq++;
      trail.replaceChildren();
      updatePath();
    }

    function truncateAfter(el) {
      const table = el.closest("table");
      while (table.nextElementSibling) table.nextElementSibling.remove();
      exploreSeq++;
      updatePath();
    }

    function link(text, onClick) {
      const a = Object.assign(document.createElement("a"), { textContent: text, href: "#" });
      a.addEventListener("click", e => { e.preventDefault(); truncateAfter(a); onClick(); });
      return a;
    }

    function addRow(parent, values, tag = "td") {
      const tr = document.createElement("tr");
      for (const value of values) {
        const cell = document.createElement(tag);
        cell.append(value);
        tr.append(cell);
      }
      parent.append(tr);
    }

    function addTable(prefix, name, kind, headers) {
      const table = document.createElement("table");
      const cap = table.createCaption();
      const pre = document.createElement("span");
      pre.className = "cap-prefix";
      pre.textContent = prefix;
      cap.append(pre, name);
      table.dataset.name = name;
      table.dataset.kind = kind;
      addRow(table.createTHead(), headers, "th");
      trail.append(table);
      updatePath();
      table.scrollIntoView({ behavior: "smooth", block: "nearest" });
      return table.createTBody();
    }

    function addEmptyRow(tbody, cols, msg) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = cols;
      td.className = "none";
      td.textContent = msg;
      tr.append(td);
      tbody.append(tr);
    }

    // The path panel is derived from the trail rather than tracked alongside it.
    function updatePath() {
      trailList.replaceChildren();
      for (const table of trail.children) {
        const li = document.createElement("li");
        li.textContent = table.dataset.name;
        li.dataset.kind = table.dataset.kind;
        trailList.append(li);
      }
      trailSection.hidden = trail.children.length === 0;
    }

    btnActors.addEventListener("click", () => {
      btnActors.textContent = trailList.classList.toggle("hide-actors") ? "Show actors" : "Hide actors";
    });

    async function showCast(movieId) {
      const seq = exploreSeq;
      try {
        const { movie, cast } = await getJson(`/v1/movies/${movieId}/cast`);
        if (seq !== exploreSeq) return;
        const label = movie.year ? `${movie.title} (${movie.year})` : movie.title;
        const tbody = addTable("Cast of", label, "movie", ["Actor", "Billing", "Popularity"]);
        if (!cast.length) addEmptyRow(tbody, 3, "No cast stored for this film");
        for (const p of cast) {
          addRow(tbody, [link(p.name, () => showFilms(p.id)), String(p.billing), p.popularity?.toFixed(1) ?? "–"]);
        }
      } catch (err) {
        if (seq === exploreSeq) setStatus(err.message, "wrong");
      }
    }

    async function showFilms(actorId) {
      const seq = exploreSeq;
      try {
        const { actor, films } = await getJson(`/v1/movies/actors/${actorId}/films`);
        if (seq !== exploreSeq) return;
        const tbody = addTable("Films with", actor.name, "actor", ["Film", "Year", "Billing"]);
        if (!films.length) addEmptyRow(tbody, 3, "No films in the database");
        for (const f of films) {
          addRow(tbody, [link(f.title, () => showCast(f.id)), f.year ?? "", String(f.billing)]);
        }
      } catch (err) {
        if (seq === exploreSeq) setStatus(err.message, "wrong");
      }
    }

    // ─── Autocomplete ─────────────────────────────────────────────────────
    // Shared by the film search and every link guess. `sub` is optional
    // right-hand text (the film year).
    let dropSeq = 0;

    function autocomplete(input, drop, { fetchItems, label, sub, onPick }) {
      const prefix = `opt-${++dropSeq}-`;
      let items = [], activeIdx = -1, typed = "", timer = null, reqSeq = 0;

      input.setAttribute("aria-autocomplete", "list");
      input.setAttribute("aria-expanded", "false");

      function close() {
        drop.hidden = true;
        input.setAttribute("aria-expanded", "false");
        input.removeAttribute("aria-activedescendant");
        activeIdx = -1;
        items = [];
      }

      function setActive(idx) {
        activeIdx = idx;
        const els = drop.querySelectorAll(".suggest-item");
        els.forEach((el, i) => el.setAttribute("aria-selected", i === idx ? "true" : "false"));
        if (idx >= 0 && els[idx]) {
          input.setAttribute("aria-activedescendant", els[idx].id);
          input.value = label(items[idx]);
        } else {
          input.removeAttribute("aria-activedescendant");
          input.value = typed;
        }
      }

      function pick(item) {
        close();
        typed = "";
        onPick(item);
      }

      function render() {
        drop.innerHTML = "";
        if (!items.length) { close(); return; }
        items.forEach((item, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "suggest-item";
          btn.id = prefix + i;
          btn.setAttribute("role", "option");
          btn.setAttribute("aria-selected", "false");

          const t = document.createElement("span");
          t.className = "suggest-title";
          t.textContent = label(item);
          btn.appendChild(t);
          if (sub) {
            const y = document.createElement("span");
            y.className = "suggest-year";
            y.textContent = sub(item) ?? "";
            btn.appendChild(y);
          }

          btn.addEventListener("mousedown", e => { e.preventDefault(); pick(item); });
          drop.appendChild(btn);
        });
        drop.hidden = false;
        input.setAttribute("aria-expanded", "true");
        setActive(-1);
      }

      input.addEventListener("input", () => {
        typed = input.value;
        clearTimeout(timer);
        const q = input.value.trim();
        if (q.length < 2) { close(); return; }
        timer = setTimeout(async () => {
          const seq = ++reqSeq;
          try {
            const next = await fetchItems(q);
            if (seq !== reqSeq) return;
            items = next ?? [];
            render();
          } catch { close(); }
        }, 200);
      });

      input.addEventListener("keydown", e => {
        if (drop.hidden) return;
        if (e.key === "ArrowDown") { e.preventDefault(); setActive(Math.min(activeIdx + 1, items.length - 1)); }
        if (e.key === "ArrowUp")   { e.preventDefault(); setActive(Math.max(activeIdx - 1, -1)); }
        if (e.key === "Enter")     { e.preventDefault(); pick(items[Math.max(activeIdx, 0)]); }
        if (e.key === "Escape")    { e.preventDefault(); input.value = typed; close(); }
      });

      input.addEventListener("blur", close);
    }

    // A new search starts a new trail
    autocomplete(searchInput, suggestDrop, {
      fetchItems: async q => (await getJson(`/v1/movies/suggest?q=${encodeURIComponent(q)}`)).results,
      label: m => m.title,
      sub: m => m.year,
      onPick: m => {
        searchInput.value = "";
        clearTrail();
        showCast(m.id);
      },
    });

    // ─── Wiring ───────────────────────────────────────────────────────────
    renderLengths();
    generate();
  </script>
</body>
</html>
