<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap">
  <style>
    /* ─── Tokens ─── */
    :root {
      --bg:               #0C0C0E;
      --surface:          #161618;
      --border:           #2C2C30;
      --text:             #EAE6DE;
      --muted:            #7A7680;
      --accent:           #C43A57;
      --accent-dim:       #8C2A3E;
      --success:          #3D8C6E;
      --success-bg:       rgba(61, 140, 110, 0.12);
      --wrong-bg:         rgba(196, 58, 87, 0.10);
      --kw-active-bg:     rgba(196, 58, 87, 0.14);
      --kw-active-border: rgba(196, 58, 87, 0.5);
      --frame-w:          min(300px, 66vw);
      --frame-h:          calc(var(--frame-w) * 1.5);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Mono", "Courier New", monospace;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3.5rem 1.5rem 3.5rem;
    }

    .wordmark {
      position: fixed;
      top: 1.25rem;
      left: 1.5rem;
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      user-select: none;
    }

    /* ─── Two-column layout ─── */
    .layout {
      display: flex;
      flex-direction: row;
      gap: 2.25rem;
      align-items: flex-start;
      width: 100%;
      max-width: 780px;
    }

    .left-col {
      display: flex;
      flex-direction: column;
      width: var(--frame-w);
      flex-shrink: 0;
    }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      flex: 1;
      min-width: 0;
      padding-top: 0.125rem;
    }

    @media (max-width: 640px) {
      .layout    { flex-direction: column; align-items: center; }
      .right-col { width: var(--frame-w); flex: none; padding-top: 0; }
    }

    /* ─── Poster ─── */
    .poster-wrap {
      position: relative;
      width: var(--frame-w);
      height: var(--frame-h);
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
    }

    .poster-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter   0.55s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.55s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity   0.25s ease;
    }

    /* Suppress ALL transitions while the image is hidden during load, so the
       initial blur/zoom snaps to its starting value without animating. */
    .poster-img.loading {
      opacity: 0;
      transition: none !important;
    }

    .poster-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--border);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* ─── Film info ─── */
    .film-info {
      padding-top: 1rem;
      min-height: 4rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.45s ease 0.15s, transform 0.45s ease 0.15s;
    }

    .film-info.revealed { opacity: 1; transform: translateY(0); }

    .film-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.2rem, 3.5vw, 1.75rem);
      font-weight: 600;
      line-height: 1.15;
      text-wrap: balance;
    }

    .film-year {
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ─── Controls ─── */
    .controls {
      display: flex;
      gap: 0.625rem;
      margin-top: 1.25rem;
    }

    .btn {
      flex: 1;
      padding: 0.7rem 0.75rem;
      font-family: "DM Mono", monospace;
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .btn:hover, .btn:focus-visible { color: var(--text); border-color: var(--text); outline: none; }
    .btn:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--text); }
    .btn:disabled { opacity: 0.35; cursor: default; }

    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--text); }
    .btn-primary:hover, .btn-primary:focus-visible {
      background: var(--accent-dim); border-color: var(--accent-dim); color: var(--text);
    }

    /* ─── Progress bar ─── */
    .blur-track {
      height: 2px;
      background: var(--border);
      margin-top: 1rem;
      overflow: hidden;
    }

    .blur-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.4s ease;
    }

    /* ─── Mode toggle (segmented control) ─── */
    .mode-toggle {
      display: flex;
      margin-top: 0.75rem;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .mode-btn {
      flex: 1;
      padding: 0.42rem 0.5rem;
      font-family: "DM Mono", monospace;
      font-size: 0.52rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: transparent;
      border: none;
      border-right: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }

    .mode-btn:last-child { border-right: none; }
    .mode-btn:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.04); }
    .mode-btn.active { background: var(--border); color: var(--text); cursor: default; }
    .mode-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* ─── Guess section ─── */
    .guess-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .section-label {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stats {
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .stats .n { color: var(--text); }

    /* ─── Guess input + dropdown ─── */
    .guess-row {
      position: relative;
      display: flex;
      gap: 0.5rem;
    }

    .guess-input {
      flex: 1;
      min-width: 0;
      font-family: "DM Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.03em;
      padding: 0.7rem 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .guess-input::placeholder { color: var(--muted); }
    .guess-input:focus { border-color: var(--muted); }
    .guess-input:disabled { opacity: 0.4; cursor: default; }

    .btn-guess {
      flex-shrink: 0;
      padding: 0.7rem 1rem;
      font-family: "DM Mono", monospace;
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .btn-guess:hover, .btn-guess:focus-visible { color: var(--text); border-color: var(--text); outline: none; }
    .btn-guess:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--text); }
    .btn-guess:disabled { opacity: 0.35; cursor: default; }

    /* ─── Autocomplete dropdown ─── */
    .suggest-drop {
      position: absolute;
      top: calc(100% - 1px);
      left: 0;
      right: 0;
      z-index: 20;
      background: var(--surface);
      border: 1px solid var(--muted);
      border-top: none;
      overflow-y: auto;
      max-height: 260px;
    }

    .suggest-drop[hidden] { display: none; }

    .suggest-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
      padding: 0.6rem 0.85rem;
      font-family: "DM Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.02em;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      transition: background 0.1s, color 0.1s;
    }

    .suggest-item:last-child { border-bottom: none; }
    .suggest-item:hover,
    .suggest-item[aria-selected="true"] { background: var(--border); color: var(--text); }
    .suggest-item[aria-selected="true"] .suggest-year { color: var(--muted); }

    .suggest-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .suggest-year  { flex-shrink: 0; font-size: 0.6rem; color: var(--border); }

    /* ─── Feedback ─── */
    .feedback {
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      min-height: 1.1rem;
      padding: 0.5rem 0.75rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .feedback.visible { opacity: 1; }
    .feedback.wrong   { background: var(--wrong-bg);   border-left: 2px solid var(--accent);  color: var(--accent); }
    .feedback.success { background: var(--success-bg); border-left: 2px solid var(--success); color: var(--success); }

    /* ─── Keywords ─── */
    .keywords-section {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .keywords-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: baseline;
    }

    .kw-btn {
      font-family: "DM Mono", monospace;
      font-weight: 400;
      letter-spacing: 0.04em;
      padding: 0.3em 0.6em;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      line-height: 1.6;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .kw-btn:hover, .kw-btn:focus-visible { color: var(--text); border-color: var(--muted); outline: none; }
    .kw-btn:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
    .kw-btn.active { background: var(--kw-active-bg); border-color: var(--kw-active-border); color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      .poster-img, .film-info, .blur-fill, .feedback { transition: none; }
    }
  </style>
</head>
<body>

  <span class="wordmark">MoviePalace</span>

  <div class="layout">

    <!-- ── Left column: poster + controls ── -->
    <div class="left-col">
      <div class="poster-wrap">
        <p class="poster-placeholder" id="placeholder">Loading…</p>
        <img class="poster-img loading" id="posterImg" alt="" aria-hidden="true">
      </div>

      <div class="film-info" id="filmInfo" aria-live="polite">
        <div class="film-title" id="filmTitle"></div>
        <div class="film-year"  id="filmYear"></div>
      </div>

      <div class="controls">
        <button class="btn"             id="btnNew"    type="button">New Film</button>
        <button class="btn btn-primary" id="btnReveal" type="button" disabled>Reveal</button>
      </div>

      <div class="blur-track" aria-hidden="true">
        <div class="blur-fill" id="blurFill" style="width:0%"></div>
      </div>

      <!-- Mode selector: persists across movies -->
      <div class="mode-toggle" role="group" aria-label="Reveal style">
        <button class="mode-btn active" id="modeBlur" type="button">Blur</button>
        <button class="mode-btn"        id="modeZoom" type="button">Zoom</button>
      </div>
    </div>

    <!-- ── Right column: guess + keywords ── -->
    <div class="right-col">

      <section class="guess-section" aria-label="Guess the film">
        <div class="section-header">
          <span class="section-label">Your guess</span>
          <span class="stats" id="stats" aria-live="polite">
            <span class="n" id="statGuesses">0</span>&nbsp;<span id="lblGuesses">guesses</span>
            &nbsp;·&nbsp;
            <span class="n" id="statHints">0</span>&nbsp;<span id="lblHints">hints</span>
          </span>
        </div>

        <div class="guess-row">
          <input
            class="guess-input"
            id="guessInput"
            type="text"
            placeholder="Name the film…"
            autocomplete="off"
            spellcheck="false"
            aria-autocomplete="list"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="suggestDrop"
            disabled
          >
          <button class="btn-guess" id="btnGuess" type="button" disabled>Submit</button>

          <div
            class="suggest-drop"
            id="suggestDrop"
            role="listbox"
            aria-label="Matching films"
            hidden
          ></div>
        </div>

        <div class="feedback" id="feedback" role="alert" aria-live="polite"></div>
      </section>

      <div class="keywords-section" id="keywordsSection">
        <span class="section-label" id="kwLabel"></span>
        <div class="keywords-cloud" id="kwCloud"></div>
      </div>

    </div>
  </div>

  <script>
    const posterImg   = document.getElementById("posterImg");
    const placeholder = document.getElementById("placeholder");
    const filmInfo    = document.getElementById("filmInfo");
    const filmTitle   = document.getElementById("filmTitle");
    const filmYear    = document.getElementById("filmYear");
    const btnNew      = document.getElementById("btnNew");
    const btnReveal   = document.getElementById("btnReveal");
    const blurFill    = document.getElementById("blurFill");
    const guessInput  = document.getElementById("guessInput");
    const btnGuess    = document.getElementById("btnGuess");
    const suggestDrop = document.getElementById("suggestDrop");
    const feedback    = document.getElementById("feedback");
    const statGuesses = document.getElementById("statGuesses");
    const statHints   = document.getElementById("statHints");
    const lblGuesses  = document.getElementById("lblGuesses");
    const lblHints    = document.getElementById("lblHints");
    const kwCloud     = document.getElementById("kwCloud");
    const kwLabel     = document.getElementById("kwLabel");
    const btnModeBlur = document.getElementById("modeBlur");
    const btnModeZoom = document.getElementById("modeZoom");

    const BLUR_MAX = 28;  // starting blur in px
    const ZOOM_MAX = 5;   // starting zoom scale (5× = 20% of poster visible)

    let current    = null;
    let revealed   = false;
    let solved     = false;
    let guessCount = 0;
    let hintSet    = new Set();
    let activeKws  = new Set();

    let revealMode = "blur"; // "blur" | "zoom"

    // Focal point for zoom mode (percentages, 0–100), set fresh each movie
    let focalX = 50, focalY = 50;

    // Autocomplete state
    let suggestions   = [];
    let activeIdx     = -1;
    let typedValue    = "";
    let debounceTimer = null;

    // ─── Stats ────────────────────────────────────────────────────────────
    function updateStats() {
      const g = guessCount, h = hintSet.size;
      statGuesses.textContent = g;
      statHints.textContent   = h;
      lblGuesses.textContent  = g === 1 ? "guess"  : "guesses";
      lblHints.textContent    = h === 1 ? "hint"   : "hints";
    }

    // ─── Keyword weight helpers ────────────────────────────────────────────
    function totalWeight(kws)   { return kws.reduce((s, k) => s + 1 / k.movieCount, 0); }
    function clickedWeight(kws) { return kws.filter(k => activeKws.has(k.id)).reduce((s, k) => s + 1 / k.movieCount, 0); }

    // ─── Blur mode ────────────────────────────────────────────────────────
    function computeBlurPx(kws) {
      if (!kws || kws.length === 0) return BLUR_MAX;
      const fraction = Math.min(1, clickedWeight(kws) / totalWeight(kws));
      return BLUR_MAX * (1 - fraction);
    }

    function applyBlur() {
      const kws = current?.keywords ?? [];
      // Make sure zoom transform is neutral when blur mode is active
      posterImg.style.transform       = "scale(1)";
      posterImg.style.transformOrigin = "50% 50%";

      if (revealed) {
        posterImg.style.filter = "none";
        blurFill.style.width   = "100%";
        return;
      }

      const px       = computeBlurPx(kws);
      const fraction = 1 - px / BLUR_MAX;
      posterImg.style.filter = px < 0.5
        ? "none"
        : `blur(${px.toFixed(2)}px) brightness(0.70) saturate(0.75)`;
      blurFill.style.width = `${(fraction * 100).toFixed(1)}%`;
    }

    // ─── Zoom mode ────────────────────────────────────────────────────────
    function newFocalPoint() {
      focalX = 20 + Math.random() * 60; // 20–80% safe zone
      focalY = 20 + Math.random() * 60;
    }

    function computeZoom(kws) {
      if (!kws || kws.length === 0) return ZOOM_MAX;
      const fraction = Math.min(1, clickedWeight(kws) / totalWeight(kws));
      return ZOOM_MAX - fraction * (ZOOM_MAX - 1);
    }

    function applyZoom() {
      const kws = current?.keywords ?? [];
      // Make sure blur filter is clear when zoom mode is active
      posterImg.style.filter = "none";

      if (revealed) {
        posterImg.style.transformOrigin = "50% 50%";
        posterImg.style.transform       = "scale(1)";
        blurFill.style.width = "100%";
        return;
      }

      const zoom     = computeZoom(kws);
      const fraction = 1 - (zoom - 1) / (ZOOM_MAX - 1);
      posterImg.style.transformOrigin = `${focalX.toFixed(1)}% ${focalY.toFixed(1)}%`;
      posterImg.style.transform       = `scale(${zoom.toFixed(4)})`;
      blurFill.style.width = `${(fraction * 100).toFixed(1)}%`;
    }

    // ─── Dispatcher ───────────────────────────────────────────────────────
    function applyReveal() {
      if (revealMode === "zoom") {
        applyZoom();
      } else {
        applyBlur();
      }
    }

    // ─── Mode toggle ──────────────────────────────────────────────────────
    function setMode(mode) {
      revealMode = mode;
      btnModeBlur.classList.toggle("active", mode === "blur");
      btnModeZoom.classList.toggle("active", mode === "zoom");
      applyReveal();
    }

    btnModeBlur.addEventListener("click", () => setMode("blur"));
    btnModeZoom.addEventListener("click", () => setMode("zoom"));

    // ─── Reveal ───────────────────────────────────────────────────────────
    function setRevealed(on) {
      revealed = on;
      applyReveal();
      filmInfo.classList.toggle("revealed", on);
      if (on) {
        filmTitle.textContent = current?.title ?? "";
        filmYear.textContent  = current?.releaseDate?.slice(0, 4) ?? "";
        btnReveal.textContent = "Hide";
        btnReveal.classList.remove("btn-primary");
      } else {
        btnReveal.textContent = "Reveal";
        btnReveal.classList.add("btn-primary");
      }
    }

    // ─── Feedback ─────────────────────────────────────────────────────────
    function showFeedback(msg, kind) {
      feedback.textContent = msg;
      feedback.className   = `feedback ${kind} visible`;
    }

    function clearFeedback() {
      feedback.className   = "feedback";
      feedback.textContent = "";
    }

    // ─── Guess ────────────────────────────────────────────────────────────
    function normalise(s) {
      return s.trim().toLowerCase().replace(/^(the|a|an)\s+/, "");
    }

    function submitGuess() {
      const raw = guessInput.value.trim();
      if (!raw || !current || solved) return;
      closeDrop();
      guessCount++;
      updateStats();

      if (normalise(raw) === normalise(current.title)) {
        const perfect = guessCount === 1 && hintSet.size === 0;
        solved = true;
        setRevealed(true);
        showFeedback(perfect ? "Perfect — first guess, no hints!" : "Correct!", "success");
        if (perfect) triggerFireworks();
        guessInput.disabled = true;
        btnGuess.disabled   = true;
        guessInput.value    = "";
      } else {
        showFeedback("Not quite — try again", "wrong");
        guessInput.value = "";
        typedValue = "";
        guessInput.focus();
      }
    }

    // ─── Autocomplete ─────────────────────────────────────────────────────
    function openDrop() {
      suggestDrop.hidden = false;
      guessInput.setAttribute("aria-expanded", "true");
    }

    function closeDrop() {
      suggestDrop.hidden = true;
      guessInput.setAttribute("aria-expanded", "false");
      guessInput.removeAttribute("aria-activedescendant");
      activeIdx   = -1;
      suggestions = [];
    }

    function renderDrop() {
      suggestDrop.innerHTML = "";
      if (suggestions.length === 0) { closeDrop(); return; }

      suggestions.forEach((item, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "suggest-item";
        btn.setAttribute("role", "option");
        btn.id = `suggest-opt-${i}`;
        btn.setAttribute("aria-selected", "false");

        const titleSpan = document.createElement("span");
        titleSpan.className   = "suggest-title";
        titleSpan.textContent = item.title;

        const yearSpan = document.createElement("span");
        yearSpan.className   = "suggest-year";
        yearSpan.textContent = item.year ?? "";

        btn.appendChild(titleSpan);
        btn.appendChild(yearSpan);

        btn.addEventListener("mousedown", (e) => {
          e.preventDefault();
          selectSuggestion(item);
        });

        suggestDrop.appendChild(btn);
      });

      openDrop();
      setActiveIdx(-1);
    }

    function setActiveIdx(idx) {
      activeIdx = idx;
      const items = suggestDrop.querySelectorAll(".suggest-item");
      items.forEach((el, i) => el.setAttribute("aria-selected", i === idx ? "true" : "false"));

      if (idx >= 0 && items[idx]) {
        guessInput.setAttribute("aria-activedescendant", items[idx].id);
        guessInput.value = suggestions[idx].title;
      } else {
        guessInput.removeAttribute("aria-activedescendant");
        guessInput.value = typedValue;
      }
    }

    function selectSuggestion(item) {
      guessInput.value = item.title;
      typedValue = item.title;
      closeDrop();
      guessInput.focus();
    }

    async function fetchSuggestions(q) {
      try {
        const res = await fetch(`/v1/movies/suggest?q=${encodeURIComponent(q)}`);
        if (!res.ok) { closeDrop(); return; }
        const data = await res.json();
        suggestions = data.results ?? [];
        renderDrop();
      } catch {
        closeDrop();
      }
    }

    guessInput.addEventListener("input", () => {
      typedValue = guessInput.value;
      activeIdx  = -1;
      clearFeedback();
      clearTimeout(debounceTimer);
      const q = guessInput.value.trim();
      if (q.length < 2) { closeDrop(); return; }
      debounceTimer = setTimeout(() => fetchSuggestions(q), 200);
    });

    guessInput.addEventListener("keydown", (e) => {
      if (!suggestDrop.hidden) {
        if (e.key === "ArrowDown") { e.preventDefault(); setActiveIdx(Math.min(activeIdx + 1, suggestions.length - 1)); return; }
        if (e.key === "ArrowUp")   { e.preventDefault(); setActiveIdx(Math.max(activeIdx - 1, -1)); return; }
        if (e.key === "Enter")     { e.preventDefault(); activeIdx >= 0 ? selectSuggestion(suggestions[activeIdx]) : (closeDrop(), submitGuess()); return; }
        if (e.key === "Escape")    { e.preventDefault(); guessInput.value = typedValue; closeDrop(); return; }
      } else if (e.key === "Enter") {
        submitGuess();
      }
    });

    document.addEventListener("mousedown", (e) => {
      if (!suggestDrop.hidden && !guessInput.contains(e.target) && !suggestDrop.contains(e.target)) {
        closeDrop();
      }
    });

    // ─── Keywords ─────────────────────────────────────────────────────────
    function kwFontSize(movieCount, minCount, maxCount) {
      const norm = 1 - (movieCount - minCount) / (maxCount - minCount || 1);
      return (0.55 + norm * 0.5).toFixed(3) + "rem";
    }

    function renderKeywords(kws) {
      kwCloud.innerHTML = "";
      if (!kws || kws.length === 0) { kwLabel.textContent = ""; return; }
      kwLabel.textContent = "Hints";

      const counts   = kws.map(k => k.movieCount);
      const minCount = Math.min(...counts);
      const maxCount = Math.max(...counts);
      const total    = totalWeight(kws);
      const shuffled = [...kws].sort(() => Math.random() - 0.5);

      for (const kw of shuffled) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "kw-btn";
        btn.textContent = kw.name;
        btn.dataset.id  = String(kw.id);
        btn.style.fontSize = kwFontSize(kw.movieCount, minCount, maxCount);
        btn.title = `+${(1 / kw.movieCount / total * 100).toFixed(0)}% reveal`;

        btn.addEventListener("click", () => {
          if (solved || revealed) return;
          if (activeKws.has(kw.id)) {
            activeKws.delete(kw.id);
            btn.classList.remove("active");
          } else {
            activeKws.add(kw.id);
            hintSet.add(kw.id);
            btn.classList.add("active");
          }
          applyReveal();
          updateStats();
        });

        kwCloud.appendChild(btn);
      }
    }

    // ─── Load ─────────────────────────────────────────────────────────────
    async function loadRandom() {
      setRevealed(false);
      clearFeedback();
      closeDrop();
      activeKws.clear();
      hintSet.clear();
      guessCount = 0;
      solved     = false;
      updateStats();
      kwCloud.innerHTML    = "";
      kwLabel.textContent  = "";
      blurFill.style.width = "0%";
      guessInput.value     = "";
      typedValue           = "";
      guessInput.disabled  = true;
      btnGuess.disabled    = true;
      btnReveal.disabled   = true;

      posterImg.classList.add("loading");
      placeholder.textContent   = "Loading…";
      placeholder.style.display = "flex";

      try {
        const res = await fetch("/v1/movies/random");
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          showFeedback(body.error ?? `HTTP ${res.status}`, "wrong");
          placeholder.textContent = "Error loading film";
          return;
        }

        current = await res.json();
        if (!current.posterUrl) { loadRandom(); return; }

        renderKeywords(current.keywords ?? []);
        newFocalPoint(); // always pick a focal point; used only in zoom mode

        const img = new Image();
        img.onload = () => {
          // Commit the starting visual state while loading class is active
          // (transition: none !important) — no animation from previous movie's state.
          if (revealMode === "zoom") {
            posterImg.style.filter          = "none";
            posterImg.style.transformOrigin = `${focalX.toFixed(1)}% ${focalY.toFixed(1)}%`;
            posterImg.style.transform       = `scale(${ZOOM_MAX})`;
          } else {
            posterImg.style.filter          = `blur(${BLUR_MAX}px) brightness(0.70) saturate(0.75)`;
            posterImg.style.transform       = "scale(1)";
            posterImg.style.transformOrigin = "50% 50%";
          }
          posterImg.src = current.posterUrl;
          posterImg.alt = current.title;

          requestAnimationFrame(() => {
            placeholder.style.display = "none";
            posterImg.classList.remove("loading");
            btnReveal.disabled  = false;
            guessInput.disabled = false;
            btnGuess.disabled   = false;
            guessInput.focus();
          });
        };
        img.onerror = () => {
          showFeedback("Poster failed to load", "wrong");
          placeholder.textContent = "Poster unavailable";
          posterImg.classList.remove("loading");
        };
        img.src = current.posterUrl;

      } catch {
        showFeedback("Could not reach the server", "wrong");
        placeholder.textContent = "Connection error";
        posterImg.classList.remove("loading");
      }
    }

    // ─── Fireworks ────────────────────────────────────────────────────────
    function triggerFireworks() {
      const canvas = document.createElement("canvas");
      Object.assign(canvas.style, {
        position: "fixed", inset: "0", zIndex: "100",
        pointerEvents: "none", width: "100%", height: "100%",
      });
      document.body.appendChild(canvas);

      const ctx = canvas.getContext("2d");
      let W, H;
      const resize = () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
      resize();
      window.addEventListener("resize", resize);

      const PALETTES = [
        ["#F2C94C", "#F2D98A", "#EAE6DE"],
        ["#C43A57", "#E8839A", "#EAE6DE"],
        ["#8BBFD4", "#B8D8E8", "#EAE6DE"],
        ["#D4A06A", "#F2C94C", "#EAE6DE"],
        ["#EAE6DE", "#F2C94C", "#C43A57"],
      ];

      class Particle {
        constructor(x, y, palette) {
          this.x     = x; this.y = y;
          this.color = palette[Math.floor(Math.random() * palette.length)];
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.5 + Math.random() * 5.5;
          this.vx    = Math.cos(angle) * speed;
          this.vy    = Math.sin(angle) * speed - Math.random() * 1.5;
          this.life  = 0.9 + Math.random() * 0.1;
          this.decay = 0.012 + Math.random() * 0.016;
          this.r     = 1.2 + Math.random() * 2.2;
          this.tail  = Math.random() > 0.6;
        }

        update() {
          this.vy += 0.09; this.vx *= 0.974; this.vy *= 0.974;
          this.x += this.vx; this.y += this.vy;
          this.life -= this.decay;
        }

        draw() {
          ctx.globalAlpha = Math.max(0, this.life);
          ctx.fillStyle   = this.color;
          ctx.beginPath();
          const r = this.r * (this.tail ? this.life : 1);
          ctx.arc(this.x, this.y, Math.max(0.1, r), 0, Math.PI * 2);
          ctx.fill();
          if (this.r > 2.5) {
            ctx.globalAlpha = Math.max(0, this.life * 0.6);
            ctx.fillStyle   = "#FFFFFF";
            ctx.beginPath();
            ctx.arc(this.x, this.y, Math.max(0.1, r * 0.35), 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      const particles = [];
      const startTime = performance.now();

      function burst(x, y) {
        const palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
        const count   = 90 + Math.floor(Math.random() * 50);
        for (let i = 0; i < count; i++) particles.push(new Particle(x, y, palette));
      }

      const schedule = [
        { ms:  80, rx: 0.50, ry: 0.32 }, { ms: 260, rx: 0.25, ry: 0.28 },
        { ms: 260, rx: 0.75, ry: 0.28 }, { ms: 480, rx: 0.38, ry: 0.42 },
        { ms: 480, rx: 0.62, ry: 0.38 }, { ms: 700, rx: 0.18, ry: 0.35 },
        { ms: 700, rx: 0.82, ry: 0.30 }, { ms: 950, rx: 0.50, ry: 0.22 },
        { ms:1150, rx: 0.30, ry: 0.25 }, { ms:1150, rx: 0.70, ry: 0.40 },
        { ms:1350, rx: 0.50, ry: 0.35 },
      ];

      schedule.forEach(({ ms, rx, ry }) => setTimeout(() => burst(W * rx, H * ry), ms));

      let rafId;
      function loop() {
        ctx.clearRect(0, 0, W, H);
        ctx.globalAlpha = 1;
        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update();
          particles[i].draw();
          if (particles[i].life <= 0) particles.splice(i, 1);
        }
        const elapsed = performance.now() - startTime;
        if (elapsed < 3000 || particles.length > 0) {
          rafId = requestAnimationFrame(loop);
        } else {
          canvas.remove();
          window.removeEventListener("resize", resize);
        }
      }

      rafId = requestAnimationFrame(loop);
    }

    // ─── Wiring ───────────────────────────────────────────────────────────
    btnNew.addEventListener("click", loadRandom);
    btnGuess.addEventListener("click", submitGuess);
    btnReveal.addEventListener("click", () => { if (!solved) setRevealed(!revealed); });

    updateStats();
    loadRandom();
  </script>
</body>
</html>
